<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anmeldung – ISO 27001</title>
<style>
  :root{
    --bg:#0f1115;--panel:#1a1d23;--border:#2a2f38;
    --text:#e6e8eb;--muted:#8b919c;--accent:#5b9dff;--err:#ffb4b4;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;
    display:flex;align-items:center;justify-content:center;padding:1.5rem}
  .card{width:100%;max-width:360px;background:var(--panel);
    border:1px solid var(--border);border-radius:14px;padding:1.75rem}
  h1{font-size:1.25rem;margin:0 0 .15rem}
  .sub{color:var(--muted);margin:0 0 1.5rem;font-size:.85rem}
  label{display:block;font-size:.8rem;color:var(--muted);margin:.9rem 0 .35rem}
  select,input{width:100%;padding:.6rem .7rem;background:var(--bg);color:var(--text);
    border:1px solid var(--border);border-radius:8px;font-size:1rem}
  button{width:100%;margin-top:1.4rem;padding:.65rem;border:0;border-radius:8px;
    background:var(--accent);color:#06122b;font-size:1rem;font-weight:600;cursor:pointer}
  button:hover{filter:brightness(1.08)}
  .err{color:var(--err);font-size:.82rem;margin-top:.8rem;min-height:1.1em}
</style>
</head>
<body>
<div class="card">
  <h1>ISO 27001 – Anmeldung</h1>
  <p class="sub">Helm &amp; Walter · Audit Tracker</p>

  <label for="role">Benutzer (Rolle)</label>
  <select id="role"><option value="">– Rolle wählen –</option></select>

  <label for="pw">Passwort</label>
  <input id="pw" type="password" autocomplete="off" placeholder="••••••" />

  <button id="login">Anmelden</button>
  <div class="err" id="err"></div>
</div>

<script>
const PASSWORD = "12345";           // demo password
const HIERARCHY = ["streng_vertraulich","vertraulich","intern","oeffentlich"];
const LABELS = {streng_vertraulich:"Streng vertraulich",vertraulich:"Vertraulich",
                intern:"Intern",oeffentlich:"Öffentlich"};

const sel = document.getElementById("role");
const err = document.getElementById("err");

// fill the dropdown with every role found in the JSON (highest level wins for the label)
fetch("/docs/conv_tables/zugriffsverwaltung.json")
  .then(r => r.json())
  .then(data => {
    const seen = new Set();
    HIERARCHY.forEach(level => {
      (data[level]?.roles || []).forEach(role => {
        if (seen.has(role)) return;
        seen.add(role);
        const o = document.createElement("option");
        o.value = role;
        o.textContent = role + " · " + (LABELS[level] || level);
        sel.appendChild(o);
      });
    });
  })
  .catch(() => { err.textContent = "zugriffsverwaltung.json konnte nicht geladen werden."; });

function login(){
  const role = sel.value;
  const pw = document.getElementById("pw").value;
  if (!role){ err.textContent = "Bitte eine Rolle wählen."; return; }
  if (pw !== PASSWORD){ err.textContent = "Falsches Passwort."; return; }
  sessionStorage.setItem("iso_role", role);   // remembered for the other pages
  window.location.href = "/zerti/";
}

document.getElementById("login").addEventListener("click", login);
document.getElementById("pw").addEventListener("keydown", e => { if (e.key === "Enter") login(); });
</script>
</body>
</html>
